<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSurya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#0c192e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glowGradSurya" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLineSurya" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shirtGradSurya" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bgGradSurya)"/>
  <circle cx="400" cy="380" r="320" fill="url(#glowGradSurya)"/>

  <!-- Geometric Subtle Tech Grid Accent -->
  <circle cx="400" cy="380" r="250" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 6" fill="none"/>
  <circle cx="400" cy="380" r="190" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <circle cx="400" cy="380" r="140" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 8" fill="none"/>

  <!-- Minimalist Executive Avatar Silhouette (Dignified & Professional) -->
  <g transform="translate(400, 360)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="-65" r="74" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Head Circle -->
    <circle cx="0" cy="-65" r="68" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Monogram Initials Inside Head -->
    <text x="0" y="-46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#38bdf8" letter-spacing="2">
      SP
    </text>

    <!-- White Executive Collared Shirt -->
    <path d="M -130 140 C -130 45 -70 10 0 10 C 70 10 130 45 130 140 Z" fill="url(#shirtGradSurya)"/>
    
    <!-- Collar Cutout -->
    <path d="M -32 10 L 0 55 L 32 10 L 0 16 Z" fill="#0c192e"/>
    
    <!-- Center Button Line -->
    <line x1="0" y1="55" x2="0" y2="135" stroke="#bae6fd" stroke-width="3"/>
    <circle cx="0" cy="75" r="4" fill="#0284c7"/>
    <circle cx="0" cy="105" r="4" fill="#0284c7"/>
  </g>

  <!-- Divider Accent Line -->
  <line x1="160" y1="630" x2="640" y2="630" stroke="url(#accentLineSurya)" stroke-width="2"/>

  <!-- Typography Hierarchy -->
  <text x="400" y="690" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" letter-spacing="4" fill="#ffffff">
    SURYA PAL
  </text>
  <text x="400" y="735" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" letter-spacing="3" fill="#38bdf8">
    CO-FOUNDER &amp; EXECUTIVE DIRECTOR
  </text>
  <text x="400" y="775" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" letter-spacing="1.5" fill="#94a3b8">
    WEBNOVA DIGITAL AGENCY
  </text>

  <!-- Verified Executive Badge -->
  <g transform="translate(400, 840)">
    <rect x="-170" y="-24" width="340" height="48" rx="24" fill="#0c192e" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="-120" cy="0" r="6" fill="#10b981"/>
    <text x="10" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#e0f2fe" letter-spacing="1">
      OFFICIAL CO-FOUNDER
    </text>
  </g>
</svg>
