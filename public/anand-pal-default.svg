<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <circle cx="400" cy="380" r="320" fill="url(#glowGrad)"/>

  <!-- Geometric Subtle Grid Accent -->
  <circle cx="400" cy="380" r="240" stroke="#334155" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 6" fill="none"/>
  <circle cx="400" cy="380" r="180" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>

  <!-- Minimalist Executive Avatar Outline -->
  <g transform="translate(400, 360)">
    <!-- Head -->
    <circle cx="0" cy="-60" r="68" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- White Collared Shirt -->
    <path d="M -130 140 C -130 45 -70 10 0 10 C 70 10 130 45 130 140 Z" fill="url(#shirtGrad)"/>
    <!-- Collar Cutout -->
    <path d="M -32 10 L 0 55 L 32 10 L 0 16 Z" fill="#0f172a"/>
    <!-- Center Button Line -->
    <line x1="0" y1="55" x2="0" y2="135" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="0" cy="75" r="4" fill="#0f172a"/>
    <circle cx="0" cy="105" r="4" fill="#0f172a"/>
  </g>

  <!-- Divider Accent Line -->
  <line x1="160" y1="630" x2="640" y2="630" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Typography -->
  <text x="400" y="690" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" letter-spacing="4" fill="#ffffff">
    ANAND PAL
  </text>
  <text x="400" y="735" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" letter-spacing="3" fill="#60a5fa">
    FOUNDER &amp; CHIEF EXECUTIVE OFFICER
  </text>
  <text x="400" y="775" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" letter-spacing="1.5" fill="#94a3b8">
    WEBNOVA DIGITAL AGENCY
  </text>

  <!-- Upload Guidance Badge -->
  <g transform="translate(400, 840)">
    <rect x="-190" y="-26" width="380" height="52" rx="26" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="17" fill="#ffffff">
      
    </text>
  </g>
</svg>
